<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <!-- 3x3 grid of rounded squares. context-fill follows the toolbar's text color
       (light or dark theme); #666 is the fallback. -->
  <g fill="context-fill #666">
    <rect x="4" y="4" width="11" height="11" rx="3"/>
    <rect x="18.5" y="4" width="11" height="11" rx="3"/>
    <rect x="33" y="4" width="11" height="11" rx="3"/>
    <rect x="4" y="18.5" width="11" height="11" rx="3"/>
    <rect x="18.5" y="18.5" width="11" height="11" rx="3"/>
    <rect x="33" y="18.5" width="11" height="11" rx="3"/>
    <rect x="4" y="33" width="11" height="11" rx="3"/>
    <rect x="18.5" y="33" width="11" height="11" rx="3"/>
    <rect x="33" y="33" width="11" height="11" rx="3"/>
  </g>
</svg>
